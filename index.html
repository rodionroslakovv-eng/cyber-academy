<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кибер-академия: от нуля до мидла</title>
<style>
:root{--bg:#0a0e16;--p:#111827;--p2:#0d1320;--b:#1f2a3d;--t:#e5e7eb;--m:#8b98ad;--red:#f05252;--blue:#4c8dff;--g:#2fd072;--y:#f5b73b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;color:var(--t);background:#1a2336;border:1px solid var(--b);border-radius:8px;padding:7px 12px}
button:hover{background:#222f48}button.pri{background:#2a5fd6;border-color:#3b73f0}button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;background:#0b1220;border:1px solid var(--b);color:var(--t);border-radius:8px;padding:7px 10px;width:100%}
.mono,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--b);background:var(--p2);flex-wrap:wrap}
header h1{font-size:16px;margin:0}header .sp{flex:1}
.bar{width:120px;height:8px;background:#1a2336;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);width:0}
#view{max-width:980px;margin:0 auto;padding:18px 16px 60px}
h2{margin:6px 0 4px}.sub{color:var(--m)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:18px 0}
.card{border:1px solid var(--b);background:var(--p);border-radius:14px;padding:18px;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-2px);border-color:#3b73f0}.card .ic{font-size:30px}.card h3{margin:6px 0}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;background:#1a2336;color:var(--m)}.badge.g{background:#14532d;color:#bff0d0}.badge.y{background:#4a3a0f;color:#ffe29a}
.grp{margin:20px 0 6px;font-weight:650;color:var(--m);text-transform:uppercase;font-size:12px;letter-spacing:.05em}
.cap{display:flex;gap:12px;align-items:center;border:1px solid var(--b);background:var(--p);border-radius:12px;padding:11px 14px;margin:7px 0}
.cap.go{cursor:pointer}.cap.go:hover{border-color:#3b73f0}.cap.lock{opacity:.5}.cap .n{width:30px;height:30px;border-radius:50%;background:#1a2336;display:grid;place-items:center;flex:none}
.cap.done .n{background:#14532d}.cap .tt{flex:1}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.tabs button.on{background:#2a5fd6;border-color:#3b73f0}
.th{white-space:pre-wrap;background:var(--p);border:1px solid var(--b);border-radius:12px;padding:16px 18px}
.box{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px 16px;margin:10px 0}
.task{border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--p)}.task.ok{border-color:#1d5a35;background:#0f2a1a}
.task .row{display:flex;gap:8px;margin-top:6px}.fb{margin-top:6px;font-size:13.5px}.fb.bad{color:#ffb3b3}.fb.good{color:#bff0d0}
#term{background:#05080e;border:1px solid var(--b);border-radius:10px;height:230px;overflow:auto;padding:8px 10px;font-size:13px;cursor:text}
.line{white-space:pre-wrap;word-break:break-all}.line.cmd{color:#fff}.line.err{color:#ff8a8a}.line.sys{color:#7e8ba3}
.inrow{display:flex;gap:6px;background:#05080e;border:1px solid var(--b);border-top:0;border-radius:0 0 10px 10px;padding:6px 10px}.inrow span{color:var(--g);white-space:nowrap}
.inrow input{border:0;background:transparent;padding:0;outline:0;color:#fff}
.q{margin:12px 0}.q b{display:block;margin-bottom:5px}.opt{display:block;padding:7px 10px;border:1px solid var(--b);border-radius:8px;margin:5px 0;cursor:pointer;background:#0b1220}.opt.sel{border-color:#3b73f0}.opt.right{border-color:#22c55e;background:#0f2a1a}.opt.wrong{border-color:#ef4444;background:#2a1010}
.ans{white-space:pre-wrap;background:#0f1a30;border:1px solid #223a6b;border-radius:10px;padding:10px 12px;margin-top:8px}
.tg{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;padding:5px 11px;border:1px solid var(--b);border-radius:99px;background:#141c2d}.tg.on{background:#4a3a0f;border-color:var(--y);color:#ffe29a}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#14532d;border:1px solid #22c55e;padding:8px 14px;border-radius:10px;display:none;z-index:50}
.gm{margin:7px 0;padding:8px 11px;border-radius:10px;white-space:pre-wrap;max-width:94%}.gm.a{background:#1a2336}.gm.u{background:#1f3a73;margin-left:auto}
.vz{border:1px solid var(--b);background:#0b1220;border-radius:12px;padding:12px;margin:10px 0}.vzr{display:flex;gap:6px;flex-wrap:wrap}.vzn{padding:6px 9px;border-radius:8px;border:1px solid var(--b);color:var(--m);font-size:13px}.vzn.on{border-color:#3b73f0;color:var(--t)}.vzn.cur{background:#1f3a73}.vzi{margin:10px 0;min-height:44px}
details.ref{margin-top:10px}details.ref summary{cursor:pointer;color:var(--m)}
select{font:inherit;background:#0b1220;border:1px solid var(--b);color:var(--t);border-radius:8px;padding:7px 10px;width:100%}
</style>
</head>
<body>
<header>
 <button id="back" style="display:none">← Назад</button>
 <h1 id="ttl">🎓 Кибер-академия</h1><span class="sp"></span>
 <button id="aiBtn" title="Настройки ИИ-наставника">⚙ ИИ</button>
 <span id="coreTg" class="tg" title="Показывать только самые нужные капсулы">⭐ Только важное</span>
 <span id="pct" class="sub"></span><div class="bar"><i id="barfill"></i></div>
</header>
<div id="view"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600)}

/* ========== прогресс ========== */
let P={done:[],core:false,pr:{}};
try{const s=JSON.parse(localStorage.getItem('acad_v1')||'null');if(s)P=Object.assign(P,s)}catch(e){}
const save=()=>{try{localStorage.setItem('acad_v1',JSON.stringify(P))}catch(e){}};
const isDone=id=>P.done.includes(id);

/* ========== ИИ (sample) ========== */
let sample=null;
const lsGet=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function curModel(){const v=lsGet('gm_model','auto');if(v!=='auto')return v;let l=[];try{l=JSON.parse(lsGet('gm_models','[]'))}catch(e){}return lsGet('gm_last','')||l[0]||'gemini-3.8-flash'}
const OVL=/\b503\b|\b429\b|high demand|overloaded|не ответила/i;
let aiStatus=null;const stat=t=>{if(aiStatus)try{aiStatus(t)}catch(e){}};
async function tfetch(u,o,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(u,Object.assign({},o,{signal:c.signal}))}catch(e){if(e.name==='AbortError')throw new Error('модель не ответила за '+Math.round(ms/1000)+' с');throw e}finally{clearTimeout(t)}}
async function flashList(){const r=await tfetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':lsGet('gm_key','')}},15000);
 if(!r.ok)throw new Error('список моделей: '+r.status);const d=await r.json();const v=n=>parseFloat(n.match(/\d+(\.\d+)?/)[0]);
 return (d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/','')).filter(n=>/^gemini-\d+(\.\d+)?-flash(-lite)?$/.test(n)).sort((x,y)=>v(y)-v(x)||x.length-y.length)}
async function gemini(prompt,json){
 let last;for(let k=0;k<2;k++){stat('Спрашиваю '+curModel()+(k?' (повтор)':'')+'…');try{return await gemini1(prompt,json)}catch(e){last=e;if(!OVL.test(e.message))throw e;stat('⏳ '+curModel()+' перегружена, жду…');await new Promise(r=>setTimeout(r,1500))}}
 try{const cur=curModel();for(const m of (await flashList()).filter(x=>x!==cur).slice(0,4)){stat('Пробую другую модель: '+m+'…');try{const t=await gemini1(prompt,json,m);lsSet(lsGet('gm_model','auto')==='auto'?'gm_last':'gm_model',m);return t}catch(e){if(!OVL.test(e.message)&&!/\b404\b/.test(e.message))throw e}}}
 catch(e){if(!OVL.test(e.message)&&!/\b404\b/.test(e.message)&&!/список моделей/.test(e.message))throw e}
 throw last}
async function gemini1(prompt,json,model){
 const r=await tfetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model||curModel())+':generateContent',{method:'POST',
  headers:{'Content-Type':'application/json','x-goog-api-key':lsGet('gm_key','')},
  body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:json?{responseMimeType:'application/json'}:{}})},45000);
 if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error('Gemini '+r.status+(m?': '+m:''))}
 const d=await r.json();const c=d.candidates&&d.candidates[0];return c&&c.content?c.content.parts.map(p=>p.text||'').join(''):''}
async function pickModel(){
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':lsGet('gm_key','')}});
 if(!r.ok)throw new Error('список моделей: '+r.status);const d=await r.json();
 const c=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/','')).map(n=>({n,m:n.match(/^gemini-(\d+(?:\.\d+)?)-flash$/)})).filter(x=>x.m).sort((a,b)=>parseFloat(b.m[1])-parseFloat(a.m[1]));
 if(!c.length)throw new Error('не нашёл подходящую модель flash');return c[0].n}
function makeSample(){const f=async(p,o)=>{const t=await gemini(typeof p==='string'?p:p.map(m=>m.content).join('\n\n'),false);if(o&&o.onText)o.onText({text:t});return{text:t}};
 f.json=async p=>JSON.parse(await gemini(p,true));return f}
async function initAI(){sample=null;if(lsGet('gm_key',''))sample=makeSample();
 else if(window.claude&&claude.use){try{sample=await claude.use('sample')}catch(e){}}
 $('#aiBtn').textContent=sample?'⚙ ИИ: подключён':'⚙ ИИ: не настроен';if(S.view==='cap')render()}
function openAI(){const m=$('#modal')||document.body.appendChild(Object.assign(el('div'),{id:'modal'}));m.style.cssText='position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:60;padding:14px';m.textContent='';
 const b=el('div','box');b.style.maxWidth='520px';b.append(el('h3','','⚙ ИИ-наставник (Gemini)'),el('div','sub','Ключ хранится только в этом браузере и отправляется напрямую в Google. Получить ключ: aistudio.google.com/apikey → «Create API key». Вставь ключ — список моделей подгрузится сам.'));
 const k=el('input');k.type='password';k.placeholder='API-ключ Gemini';k.value=lsGet('gm_key','');const sel=el('select');const rf=el('button','','↻');rf.title='Обновить список моделей';
 const fb=el('div','fb');const sv=el('button','pri','Сохранить и проверить'),cl=el('button','','Закрыть');
 const fillSel=()=>{let l=[];try{l=JSON.parse(lsGet('gm_models','[]'))}catch(e){}const cur=lsGet('gm_model','auto');sel.textContent='';const add=(v,t)=>{const o=el('option','',t);o.value=v;sel.append(o)};add('auto','Авто (лучшая доступная)');l.forEach(x=>add(x,x));if(cur!=='auto'&&!l.includes(cur))add(cur,cur);sel.value=cur};
 const load=async()=>{const key=k.value.trim();if(!key)return;lsSet('gm_key',key);fb.className='fb';fb.textContent='Загружаю список моделей…';
  try{const l=await flashList();lsSet('gm_models',JSON.stringify(l));fillSel();fb.className='fb good';fb.textContent='Найдено моделей: '+l.length+'. Выбери и нажми «Сохранить и проверить».'}catch(e){fb.className='fb bad';fb.textContent='❌ '+e.message+' (проверь ключ)'}};
 k.oninput=()=>{clearTimeout(k._t);k._t=setTimeout(load,800)};rf.onclick=load;
 sv.onclick=async()=>{lsSet('gm_key',k.value.trim());lsSet('gm_model',sel.value||'auto');fb.className='fb';fb.textContent='Проверяю ключ…';sv.disabled=true;const t0=Date.now();
  aiStatus=x=>{fb.textContent=x+' ('+Math.round((Date.now()-t0)/1000)+' с)'};
  try{const l=await flashList();lsSet('gm_models',JSON.stringify(l));fillSel();stat('✓ Ключ верный. Пробный запрос к модели');
   const t=await gemini('Ответь одним словом: ок',false);fb.className='fb good';fb.textContent='✅ Работает (модель '+curModel()+', '+Math.round((Date.now()-t0)/1000)+' с). Ответ: '+t.slice(0,40);fillSel();await initAI()}
  catch(e){if(/список моделей: 4/.test(e.message)){fb.className='fb bad';fb.textContent='❌ Ключ не принят Google ('+e.message+'). Проверь, что скопирован целиком.';return}fb.className='fb bad';fb.textContent=OVL.test(e.message)?'⏳ Модели Google сейчас перегружены. Ключ в порядке — попробуй через минуту или выбери другую модель.':'❌ '+e.message+' (проверь ключ)'}
  finally{aiStatus=null;sv.disabled=false}};
 cl.onclick=()=>m.style.display='none';cl.style.marginLeft='6px';
 const l1=el('div','sub','Ключ');l1.style.marginTop='10px';const l2=el('div','sub','Модель');l2.style.marginTop='8px';const mr=el('div');mr.style.cssText='display:flex;gap:6px';mr.append(sel,rf);rf.style.flex='none';
 const r=el('div');r.style.marginTop='10px';r.append(sv,cl);b.append(l1,k,l2,mr,r,fb);m.append(b);fillSel();
 if(k.value&&!lsGet('gm_models',''))load()}
$('#aiBtn').onclick=openAI;
async function aiJSON(prompt){
 try{return await sample.json(prompt,{cache:false})}catch(e){
  const r=await sample(prompt,{cache:false});const m=r.text.match(/\{[\s\S]*\}/);if(!m)throw new Error('bad');return JSON.parse(m[0])}}

/* ========== контент ========== */
const T=(...a)=>a.join('\n');
const GN3=[
 {title:'Зачем нужен DNS',fact:'Компьютеры общаются по IP-адресам (числам), а людям удобнее имена. DNS (Domain Name System) переводит имя сайта в IP-адрес — как телефонная книга переводит имя человека в номер.',analogy:'Ты не помнишь номер друга, но помнишь имя — и находишь номер в контактах.',ask:'Своими словами: зачем нужен DNS и что он делает?'},
 {title:'Путь запроса',viz:'dns',fact:'Когда открывается shop.lab: браузер смотрит свой кэш → спрашивает DNS-резолвер → при необходимости резолвер идёт к корневому серверу → серверу зоны (.lab) → авторитетному серверу домена, который знает IP. Ответ запоминается в кэше.',analogy:'Как найти человека по фамилии: спросить консьержа, он отправит в справочное бюро района, а оттуда — в домоуправление, где знают точный адрес.',ask:'Опиши своими словами, кого и в каком порядке спрашивает браузер, пока не получит IP.'},
 {title:'Типы записей',fact:'A — имя → IPv4-адрес; AAAA — имя → IPv6; CNAME — псевдоним на другое имя; MX — почтовый сервер домена; TXT — произвольный текст (подтверждение владения доменом, защита почты).',analogy:'Записи — это разные графы в карточке организации: адрес офиса, адрес для писем, второе название.',ask:'Какая запись нужна, чтобы имя вело на IPv4-адрес, и какая — чтобы почта приходила на нужный сервер?'},
 {title:'DNS и безопасность',fact:'DNS часто используют в атаках: подмена ответов (спуфинг), домены-двойники для фишинга, вывод данных через DNS-запросы. Заражённые компьютеры обращаются к подозрительным доменам, поэтому DNS-логи важны аналитику.',analogy:'Если справочное бюро подменить, люди будут приходить не по тому адресу — и даже не заметят.',ask:'Почему аналитику ИБ полезно смотреть DNS-логи? Приведи пример.'}
];
const CAPS={
l1:{t:'Командная строка Linux: первые шаги',core:1,ready:1,
 theory:T('Терминал — это способ управлять компьютером текстом: ты печатаешь команду, система отвечает. Почти все серверы в мире управляются именно так, поэтому в ИБ без терминала никуда.','','Представь файловую систему как дом с комнатами:','  pwd — «где я?» (показывает текущую папку)','  ls — «что здесь лежит?»','  cd папка — «перейти в комнату»','  cat файл — «прочитать файл»','','Флаги — это опции команды: ls -a показывает ещё и скрытые файлы (их имена начинаются с точки). Атакующие любят прятать там свои вещи, а защитники — проверять.','','Зачем это в ИБ: логи, настройки и улики — это файлы. Умея быстро их находить и читать, ты ведёшь расследование в разы быстрее.'),
 practice:[
  {type:'cmd',q:'Узнай, в какой ты папке.',hint:'pwd',rx:/^pwd$/},
  {type:'cmd',q:'Покажи все файлы, включая скрытые.',hint:'ls -a',rx:/^ls\s+-\w*a/ ,out:/\.hidden/},
  {type:'cmd',q:'Прочитай скрытый файл.',hint:'cat .hidden',rx:/^cat\s+\.hidden$/},
  {type:'cmd',q:'Перейди в папку /etc и прочитай файл hostname (имя компьютера).',hint:'cd /etc  →  cat hostname',rx:/^cat\s+(\/etc\/)?hostname$/,out:/\S/}],
 quiz:[{q:'Что делает команда ls -a?',o:['Удаляет все файлы','Показывает все файлы, включая скрытые','Печатает текущую папку'],a:1,w:'Флаг -a (all) добавляет скрытые файлы — те, чьи имена начинаются с точки.'},
  {q:'Какая команда показывает, в какой папке ты находишься?',o:['cd','cat','pwd'],a:2,w:'pwd = print working directory.'}]},
l2:{t:'Права доступа к файлам',core:1,ready:1,
 theory:T('В Linux у каждого файла есть владелец и правила: кто что может с ним делать. Смотрим командой ls -l:','','  -rw-r--r--  1 student student  120 notes.txt','','Разбор первого блока из 10 символов:','  первый символ: - файл, d папка','  затем три тройки: владелец | группа | все остальные','  в каждой тройке: r — читать, w — писать, x — запускать, «-» — нельзя','','Права записывают и числами: r=4, w=2, x=1, и складывают.','  644 = rw-r--r--  (владелец читает и пишет, остальные только читают)','  600 = rw-------  (только владелец) — так хранят секретные ключи','  755 = rwxr-xr-x  (программа: все могут запускать)','','Команда chmod меняет права: chmod 600 файл, chmod +x скрипт.','','Зачем в ИБ: типичная ошибка — права 777 (всем всё) на файлах с паролями. В расследованиях всегда проверяют, кто мог прочитать или изменить файл.'),
 practice:[
  {type:'cmd',q:'Посмотри права файлов в текущей папке.',hint:'ls -l',rx:/^ls\s+-\w*l/},
  {type:'cmd',q:'Файл secret.key доступен всем на чтение. Сделай его доступным только владельцу (600).',hint:'chmod 600 secret.key',rx:/^chmod\s+600\s+secret\.key$/},
  {type:'cmd',q:'Сделай скрипт script.sh запускаемым.',hint:'chmod +x script.sh',rx:/^chmod\s+\+x\s+script\.sh$/},
  {type:'ans',q:'Что означает права 644 простыми словами?',hint:'Подумай: 6 = 4+2, 4 = только чтение.',ok:v=>/(владел|хозя).*(чита|запис|изм)|rw-r--r--/i.test(v)},
  {type:'ans',q:'Чем опасно выставить 777 на файл с паролями?',hint:'777 = для всех: читать, писать, запускать.',ok:v=>/любой|все(м)?\b|кто угодно|посторонн/i.test(v)}],
 quiz:[{q:'Что означает -rwxr-xr-- ?',o:['Папка, все могут всё','Файл: владелец rwx, группа r-x, остальные только r','Файл, который нельзя читать никому'],a:1,w:'Первый символ «-» = файл; затем rwx | r-x | r--.'},
  {q:'Какие права лучше для приватного ключа?',o:['777','644','600'],a:2,w:'600: читать и писать может только владелец.'}]},
n1:{t:'IP-адрес: адрес устройства в сети',core:1,ready:1,
 theory:T('Представь город: у каждого дома есть адрес, чтобы почтальон знал, куда нести письмо. В сети у каждого устройства (компьютер, телефон, сервер) тоже есть адрес — IP-адрес. В версии IPv4 он выглядит так: 192.168.1.15 — четыре числа от 0 до 255 через точки.','','Адреса бывают:','  публичные — видны всему интернету (например, у сайтов);','  частные — только внутри дома или офиса: 10.x.x.x, 172.16–31.x.x, 192.168.x.x;','  127.0.0.1 — «я сам» (localhost), адрес твоего же компьютера.','','Людям запоминать числа неудобно, поэтому придумали имена (shop.lab) — их превращает в числа служба DNS (отдельная капсула).','','Зачем в ИБ: в логах почти всегда есть IP. По нему находят источник атаки, блокируют его, сопоставляют события разных систем.'),
 practice:[
  {type:'cmd',q:'Узнай IP-адрес своего компьютера.',hint:'ip a',rx:/^ip\s+(a|addr)/,out:/10\.0\.0\.10/},
  {type:'cmd',q:'Проверь, достижим ли сервер shop.lab.',hint:'ping shop.lab',rx:/^ping\s+(-c\s*\d+\s+)?shop\.lab$/,out:/bytes from/},
  {type:'ans',q:'Какой из адресов частный: 8.8.8.8, 192.168.0.5 или 93.184.1.1?',hint:'Частные начинаются с 10., 172.16–31. или 192.168.',ok:v=>/192\.168\.0\.5/.test(v)},
  {type:'ans',q:'Что означает адрес 127.0.0.1?',hint:'Подсказка: слово localhost.',ok:v=>/себ|localhost|я сам|этот (компьютер|устройств)|свой|мо[ей] компьют/i.test(v)}],
 quiz:[{q:'Какой адрес — частный?',o:['8.8.4.4','10.20.30.40','203.0.113.9'],a:1,w:'10.0.0.0–10.255.255.255 — частный диапазон.'},
  {q:'Зачем аналитику ИБ IP-адрес в логе?',o:['Чтобы определить источник события и при необходимости его заблокировать','Чтобы узнать пароль пользователя','Он нужен только для интернета'],a:0,w:'IP показывает, откуда пришёл запрос.'}]},
n2:{t:'Подсети и маска',core:1,ready:1,
 theory:T('Большую сеть делят на подсети — как город на районы. Чтобы понять, где «район», а где «дом», к IP добавляют маску.','','Запись 192.168.1.0/24 означает: первые 24 бита (три первых числа) — это номер сети, оставшиеся 8 бит — номера устройств.','','Сколько устройств помещается:','  /24 → 2^8 = 256 адресов, минус 2 служебных (адрес сети и широковещательный) = 254 устройства','  /30 → 2^2 = 4 − 2 = 2 устройства','  /16 → 2^16 = 65536 − 2 = 65534','','Устройства в одной подсети общаются напрямую, в разные — через маршрутизатор. В 10.0.0.0/24 первый адрес 10.0.0.0 — это сеть, последний 10.0.0.255 — широковещательный (для «всех сразу»).','','Зачем в ИБ: сегментация сети — базовая защита. Если «серверы» и «гостевой Wi-Fi» в разных подсетях с файрволом между ними, злоумышленник не доберётся от одного до другого.'),
 practice:[
  {type:'ans',q:'Сколько устройств помещается в сеть /24?',hint:'256 − 2',ok:v=>/\b254\b/.test(v)},
  {type:'ans',q:'А в /30?',hint:'4 − 2',ok:v=>/^\s*2\s*$|\b2\b(?!\d)/.test(v)},
  {type:'ans',q:'Какой широковещательный адрес у сети 10.0.0.0/24?',hint:'Последний адрес сети.',ok:v=>/10\.0\.0\.255/.test(v)},
  {type:'ans',q:'192.168.1.10 и 192.168.1.200 в сети /24 — в одной подсети? Ответь да/нет и почему.',hint:'Первые три числа совпадают?',ok:v=>/да|одн(ой|а)|yes/i.test(v)&&!/^\s*нет/i.test(v)}],
 quiz:[{q:'Сколько хостов в /24?',o:['256','254','24'],a:1,w:'256 адресов минус адрес сети и широковещательный.'},
  {q:'Зачем делят сеть на подсети (сегментация)?',o:['Чтобы интернет работал быстрее','Чтобы ограничить, кто с кем может общаться, и сузить ущерб от взлома','Это нужно только провайдеру'],a:1,w:'Файрвол между сегментами не даёт атаке свободно распространяться.'}]},
n3:{t:'DNS: телефонная книга интернета',core:1,ready:1,guided:GN3,
 theory:T('Компьютеры общаются по IP-адресам, а люди запоминают имена. DNS (Domain Name System) переводит имя в адрес — как телефонная книга.','','Что происходит, когда ты открываешь shop.lab:','  1) браузер смотрит в свой кэш;','  2) спрашивает DNS-резолвер (обычно у провайдера);','  3) тот при необходимости опрашивает цепочку серверов: корневые → зона (.lab) → сервер самого домена;','  4) получает ответ и сообщает адрес браузеру.','','Типы записей:','  A — имя → IPv4-адрес','  AAAA — имя → IPv6','  CNAME — псевдоним на другое имя','  MX — почтовый сервер домена','  TXT — произвольный текст (используют для проверки почты и владения доменом)','','Зачем в ИБ: DNS — частая цель и инструмент атак. Подмена ответов (спуфинг), домены-двойники для фишинга, утечка данных через DNS-запросы. В логах DNS часто находят заражённые машины: они обращаются к подозрительным доменам.'),
 practice:[
  {type:'cmd',q:'Узнай IP-адрес имени shop.lab.',hint:'nslookup shop.lab',rx:/^nslookup\s+shop\.lab$/,out:/10\.0\.0\.5/},
  {type:'cmd',q:'А у mail.lab?',hint:'nslookup mail.lab',rx:/^nslookup\s+mail\.lab$/,out:/10\.0\.0\.7/},
  {type:'ans',q:'Какая запись связывает имя с IPv4-адресом? (одна буква)',hint:'Самая простая запись.',ok:v=>/^\s*a\s*$/i.test(v)},
  {type:'ans',q:'Какая запись указывает почтовый сервер домена?',hint:'Mail e...',ok:v=>/mx/i.test(v)}],
 quiz:[{q:'Что делает DNS?',o:['Шифрует трафик','Переводит имена сайтов в IP-адреса','Блокирует вирусы'],a:1,w:'DNS — «телефонная книга»: имя → адрес.'},
  {q:'Почему аналитик смотрит DNS-логи?',o:['Заражённые машины часто обращаются к подозрительным доменам','Чтобы узнать пароли','Они показывают температуру сервера'],a:0,w:'Вредоносное ПО обращается к своим управляющим серверам по именам.'}]},
n4:{t:'Порты, TCP и UDP',core:1,ready:1,
 theory:T('Если IP — адрес дома, то порт — номер квартиры. На одном сервере работают разные службы: сайт, почта, удалённый вход. Порт указывает, к какой именно служебе обращаться. Портов 65535.','','Запомни основные:','  22 — SSH (безопасный удалённый вход)','  53 — DNS','  80 — HTTP (сайты без шифрования)','  443 — HTTPS (сайты с шифрованием)','  25 — SMTP (отправка почты)','  3389 — RDP (удалённый рабочий стол Windows)','  3306 — MySQL (база данных)','','Два способа доставки данных:','  TCP — как заказное письмо с подтверждением: сначала «рукопожатие» (SYN → SYN-ACK → ACK), потом надёжная передача. Для сайтов, почты, SSH.','  UDP — как открытка: отправил и всё, без подтверждений. Быстро; для DNS, видео, звонков.','','«Открытый порт» значит, что на нём кто-то слушает. Каждый лишний открытый порт — лишняя дверь, в которую можно стучаться. Поэтому админы закрывают всё ненужное, а злоумышленники сканируют порты в поисках открытых дверей.'),
 practice:[
  {type:'cmd',q:'Посмотри, какие порты слушает сервер (опция -tuln).',hint:'ss -tuln',rx:/^ss\s+-\w+/,out:/:22\b/},
  {type:'ans',q:'Какой порт у HTTPS?',hint:'Цифры из теории.',ok:v=>/\b443\b/.test(v)},
  {type:'ans',q:'Какой порт у SSH?',hint:'Один из первых.',ok:v=>/\b22\b/.test(v)},
  {type:'ans',q:'В выводе ss порт 3306 (база данных) доступен всей сети, хотя БД нужна только самому приложению на этом же сервере. Что не так и что сделать?',hint:'Лишняя «дверь».',ok:v=>/лишн|закры|наруж|огранич|файрвол|только локальн|127\.0\.0\.1|localhost/i.test(v)}],
 quiz:[{q:'Что такое порт?',o:['Номер службы на устройстве, к которой идёт обращение','Разъём на корпусе','Пароль сервера'],a:0,w:'IP — дом, порт — квартира.'},
  {q:'Чем TCP отличается от UDP?',o:['TCP устанавливает соединение и подтверждает доставку, UDP — нет','UDP надёжнее','Разницы нет'],a:0,w:'TCP надёжный, UDP быстрый.'}]},
n5:{t:'HTTP и коды ответа',core:1,ready:1,
 theory:T('HTTP — язык, на котором браузер общается с сайтом: запрос → ответ.','','Запрос: метод (GET — получить, POST — отправить данные), адрес и заголовки.','Ответ: код состояния, заголовки и тело (страница).','','Коды:','  2xx — успех (200 OK)','  3xx — перенаправление (301: страница переехала)','  4xx — ошибка клиента (401 нужен вход, 403 запрещено, 404 не найдено)','  5xx — ошибка сервера (500)','','HTTPS = HTTP внутри шифрованного канала TLS: никто по дороге не прочитает и не подменит данные.','','Зачем в ИБ: коды в логах рассказывают историю. Сотни 404 с одного IP на разные адреса — кто-то ищет, что есть на сервере (сканирование). Подряд 401 на странице входа — подбор пароля. Неожиданные 500 после странных запросов — кто-то ломает приложение. Читать коды — первое умение аналитика.'),
 practice:[
  {type:'cmd',q:'Запроси главную страницу сайта вместе с заголовками.',hint:'curl -i shop.lab',rx:/^curl\s+(-\w+\s+)*-i\s+(http:\/\/)?shop\.lab\/?$|^curl\s+-i\s+(http:\/\/)?shop\.lab\/?$/,out:/200/},
  {type:'cmd',q:'Запроси несуществующую страницу /nothing и получи 404.',hint:'curl -i shop.lab/nothing',rx:/^curl\s+-i\s+(http:\/\/)?shop\.lab\/nothing$/,out:/404/},
  {type:'cmd',q:'Запроси /secret только заголовки (-I) и получи 403.',hint:'curl -I shop.lab/secret',rx:/^curl\s+-I\s+(http:\/\/)?shop\.lab\/secret$/,out:/403/},
  {type:'ans',q:'Что означает код 301?',hint:'Страница переехала.',ok:v=>/перенаправ|redirect|переех|перемещ/i.test(v)},
  {type:'ans',q:'В логе сотни запросов с одного IP, и почти все — 404 на разные адреса. Что это, скорее всего?',hint:'Он что-то ищет.',ok:v=>/скан|разведк|поиск|перебор|ищет/i.test(v)}],
 quiz:[{q:'Какой код значит «нужна авторизация»?',o:['200','401','500'],a:1,w:'401 Unauthorized.'},
  {q:'Много подряд 401 на странице входа с одного IP — это…',o:['Обычная работа','Возможный подбор пароля','Ошибка в браузере'],a:1,w:'Брутфорс виден именно так.'}]},
s1:{t:'Триада CIA: конфиденциальность, целостность, доступность',core:1,ready:1,
 theory:T('Вся информационная безопасность держится на трёх целях. Их называют CIA (не путать с разведкой):','','Конфиденциальность (Confidentiality) — информацию видят только те, кому можно. Пример нарушения: утечка базы клиентов.','Целостность (Integrity) — данные не изменили незаметно. Пример нарушения: в договоре тихо поменяли сумму.','Доступность (Availability) — система работает, когда нужна. Пример нарушения: сайт лёг из-за DDoS-атаки или шифровальщика.','','Любой инцидент можно разобрать вопросом: какая из трёх свойств пострадало? Часто несколько сразу: шифровальщик нарушает доступность, а если ещё и украл данные — то и конфиденциальность.','','Меры защиты тоже раскладываются по этим трём: шифрование и права — конфиденциальность; хэши и подписи — целостность; резервные копии и защита от DDoS — доступность.'),
 practice:[
  {type:'ans',q:'Злоумышленник скачал базу клиентов. Что нарушено?',hint:'Один из трёх вариантов.',ok:v=>/конфиден/i.test(v)},
  {type:'ans',q:'Сайт магазина недоступен из-за DDoS. Что нарушено?',hint:'Работает ли система?',ok:v=>/доступн/i.test(v)},
  {type:'ans',q:'Кто-то незаметно поменял реквизиты в счёте. Что нарушено?',hint:'Данные изменили.',ok:v=>/целост/i.test(v)},
  {type:'ans',q:'Шифровальщик заблокировал файлы и пригрозил опубликовать их. Что нарушено?',hint:'Подумай про два свойства.',ok:v=>/доступн/i.test(v)&&/конфиден/i.test(v)}],
 quiz:[{q:'Резервные копии защищают в первую очередь…',o:['Конфиденциальность','Доступность','Ничего'],a:1,w:'Позволяют восстановить работу после сбоя или шифровальщика.'},
  {q:'Цифровая подпись документа помогает с…',o:['Целостностью (понять, что документ не изменён)','Скоростью интернета','Доступностью'],a:0,w:'Если документ изменить, подпись перестанет сходиться.'}]},
s3:{t:'Пароли и хэши',core:1,ready:1,
 theory:T('Сайты не хранят твой пароль как есть. Они хранят хэш — «отпечаток» пароля, полученный односторонней функцией: из пароля хэш получить легко, а из хэша вернуть пароль напрямую — нельзя.','','Вход выглядит так: ты вводишь пароль → сайт считает его хэш → сравнивает с сохранённым.','','Важные свойства хэша:','  одинаковые данные всегда дают одинаковый хэш;','  малейшее изменение даёт совершенно другой хэш (проверь в практике);','  результат всегда одной длины.','','Проблема: если у двух пользователей одинаковый пароль, хэши одинаковы, и по готовым таблицам популярных паролей их можно найти. Решение — соль (salt): случайная добавка к каждому паролю перед хэшированием, она делает хэши разными.','','Что делает пароль стойким: длина важнее «хитрых» символов. Четыре случайных слова надёжнее, чем Tr0ub4dor!. Не используй один пароль везде и включай MFA (второй фактор).','','Зачем в ИБ: утечка базы с хэшами — частый инцидент. Слабые пароли подбирают за минуты, сильные и солёные — практически нет.'),
 practice:[
  {type:'cmd',q:'Посчитай SHA-256 хэш слова password.',hint:'sha256 password',rx:/^sha256\s+password$/,out:/5e884898/},
  {type:'cmd',q:'Теперь для Password (с большой буквы) и сравни: хэш совсем другой.',hint:'sha256 Password',rx:/^sha256\s+Password$/,out:/[0-9a-f]{64}/},
  {type:'ans',q:'Можно ли из хэша напрямую вычислить пароль?',hint:'Односторонняя функция.',ok:v=>/нет|невозм|односторон|нельзя/i.test(v)},
  {type:'ans',q:'Зачем нужна соль?',hint:'Подумай про одинаковые пароли.',ok:v=>/одинаков|разн|радуж|rainbow|таблиц|уникальн/i.test(v)},
  {type:'ans',q:'Что надёжнее: Tr0ub4dor! или фраза из четырёх случайных слов? Почему?',hint:'Длина.',ok:v=>/слов|фраз|длин/i.test(v)}],
 quiz:[{q:'Что хранит правильно сделанный сайт вместо пароля?',o:['Сам пароль','Хэш пароля (желательно с солью)','Первые три символа'],a:1,w:'Хэш + соль.'},
  {q:'Что лучше повышает стойкость пароля?',o:['Длина','Заменить a на @','Заглавная буква в начале'],a:0,w:'Каждый символ длины сильно увеличивает число вариантов.'}]}

 case 'cd':{const p=resolve(a[0]||HOME);if(!FS[p]||!FS[p].d)return{err:'cd: нет такой папки'};cwd=p;return{out:''}}
 case 'cat':{if(!a.length)return{err:'cat: укажи файл'};const o=[];for(const f of a){const p=resolve(f);if(!FS[p])return{err:'cat: '+f+': нет такого файла'};if(FS[p].d)return{err:'cat: '+f+': это папка'};o.push(FS[p].c)}return{out:o.join('\n')}}
 case 'chmod':{const m=a[0],f=a[1];const p=resolve(f||'');if(!m||!f)return{err:'chmod: chmod 600 файл  или  chmod +x файл'};if(!FS[p]||FS[p].d)return{err:'chmod: '+f+': нет такого файла'};
  if(/^[0-7]{3}$/.test(m)){FS[p].p=[...m].map(n=>(n&4?'r':'-')+(n&2?'w':'-')+(n&1?'x':'-')).join('');return{out:''}}
  if(m==='+x'){const s=(FS[p].p||'rw-r--r--').split('');[2,5,8].forEach(i=>s[i]='x');FS[p].p=s.join('');return{out:''}}return{err:'chmod: поддерживаются 3 цифры (например 600) и +x'}}
 case 'ip':return a[0]==='a'||a[0]==='addr'?{out:'1: lo: inet 127.0.0.1/8\n2: eth0: inet 10.0.0.10/24 brd 10.0.0.255'}:{err:'ip: используй  ip a'};
 case 'ping':{const h=a.filter(x=>x[0]!=='-'&&!/^\d+$/.test(x))[0];if(!HOSTS[h]&&!Object.values(HOSTS).includes(h))return{err:'ping: '+h+': неизвестный хост'};const ip=HOSTS[h]||h;
  return{out:'PING '+h+' ('+ip+')\n64 bytes from '+ip+': icmp_seq=1 ttl=64 time=0.42 ms\n64 bytes from '+ip+': icmp_seq=2 ttl=64 time=0.39 ms\n64 bytes from '+ip+': icmp_seq=3 ttl=64 time=0.41 ms'}}
 case 'nslookup':{const h=a[0];if(!HOSTS[h])return{err:"** server can't find "+h+': NXDOMAIN'};return{out:'Server: 10.0.0.1\n\nName:    '+h+'\nAddress: '+HOSTS[h]}}
 case 'ss':return{out:'Netid State  Local Address:Port\ntcp   LISTEN 0.0.0.0:22     (ssh)\ntcp   LISTEN 0.0.0.0:80     (http)\ntcp   LISTEN 0.0.0.0:3306   (mysql)\nudp   UNCONN 0.0.0.0:53     (dns)'};
 case 'curl':return curl(a);
 default:return{err:'bash: '+c+': команда не найдена (набери help)'}}}
function tprint(t,c){const T=$('#term');if(!T)return;T.append(el('div','line '+(c||''),t));T.scrollTop=T.scrollHeight}
async function runLine(line){line=line.trim();if(!line)return;tprint(prompt()+' '+line,'cmd');const tk=tokenize(line);let r;
 if(tk[0]==='sha256'){const txt=tk.slice(1).join(' ');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));r={out:[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}
 else r=exec(tk);
 if(r.clear)$('#term').textContent='';else if(r.err)tprint(r.err,'err');else if(r.out)tprint(r.out);
 hist.push({cmd:line,out:r.err||r.out||''});updTasks()}

/* --- практика --- */
function prKey(){return P.pr[S.cap]||(P.pr[S.cap]=[])}
function practice(v,c){
 const hasCmd=c.practice.some(t=>t.type==='cmd');
 v.append(el('div','sub','Выполни задания. Подсказка есть у каждого. Заданий: '+c.practice.length+'.'));
 if(hasCmd){if(!FS)initFS();initFS();const T=el('div','mono');T.id='term';T.onclick=()=>inp.focus();v.append(T);
  const row=el('div','inrow mono');const pr=el('span','',prompt());const inp=el('input','mono');inp.autocomplete='off';inp.spellcheck=false;inp.placeholder='команда…  (help — список)';row.append(pr,inp);v.append(row);
  let hp=0;inp.onkeydown=async e=>{if(e.key==='Enter'){const x=inp.value;inp.value='';await runLine(x);pr.textContent=prompt();hp=hist.length}else if(e.key==='ArrowUp'){if(hp>0){hp--;inp.value=hist[hp].cmd}e.preventDefault()}};
  tprint('Учебный терминал (симуляция). Набери help.','sys')}
 const list=el('div');list.id='tasks';v.append(list);updTasks();
 const nx=el('button','pri','Дальше: проверка →');nx.style.marginTop='10px';nx.onclick=()=>{S.tab=2;render()};v.append(nx)}
function taskOk(i,t){if(prKey().includes(i))return true;if(t.type==='cmd'&&hist.some(h=>t.rx.test(h.cmd.trim())&&(!t.out||t.out.test(h.out)))){prKey().push(i);save();return true}return false}
function updTasks(){const list=$('#tasks');if(!list)return;list.textContent='';const c=CAPS[S.cap];
 c.practice.forEach((t,i)=>{const ok=taskOk(i,t);const d=el('div','task'+(ok?' ok':''));d.append(el('div','',(ok?'✅ ':'▶ ')+(i+1)+'. '+t.q));
  if(!ok){const hb=el('button','','💡 Подсказка');hb.style.marginTop='6px';hb.onclick=()=>{hb.replaceWith(el('div','sub','💡 '+t.hint))};
   if(t.type==='ans'){const row=el('div','row');const inp=el('input');inp.placeholder='твой ответ…';const b=el('button','pri','Проверить');const fb=el('div','fb');
    const chk=()=>{if(t.ok(inp.value)){prKey().push(i);save();updTasks()}else{fb.className='fb bad';fb.textContent='Пока не то. Перечитай капсулу или возьми подсказку.'}};
    b.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};row.append(inp,b);d.append(row,fb)}
   d.append(hb)}
  list.append(d)})}

/* --- проверка --- */
let QZ={};
function quiz(v,c){
 const pd=c.practice.every((t,i)=>prKey().includes(i));
 if(!pd)v.append(el('div','box','💡 Рекомендую сначала закончить практику (выполнено '+prKey().length+' из '+c.practice.length+'). Но проверку можно пройти и сейчас.'));
 if(isDone(S.cap))v.append(el('div','box','✅ Капсула уже пройдена. Можно пересдать для закрепления.'));
 const ai=el('div','box');ai.append(el('b','','🤖 Вопросы от ИИ (каждый раз новые)'));
 if(!sample)ai.append(el('div','sub','ИИ не подключён (кнопка «⚙ ИИ» вверху) — пройди быструю проверку ниже.'));
 else{const st=QZ[S.cap]||(QZ[S.cap]={asked:[]});
  if(!st.qs){const b=el('button','pri','Сгенерировать вопросы');b.style.marginTop='8px';b.onclick=async()=>{b.disabled=true;b.textContent='Генерирую…';
    try{const r=await aiJSON('Составь 3 коротких вопроса для проверки понимания по теме «'+c.t+'» для новичка с нуля. Вопросы на понимание, а не на зубрёжку, ответы — 1–3 предложения. Не повторяй уже заданные: '+JSON.stringify(st.asked)+'. Случайное число для разнообразия: '+Math.floor(Math.random()*1e6)+'.\nТеория для опоры:\n'+c.theory+'\nВерни только JSON: {"questions":["...","...","..."]}');
     st.qs=(r.questions||[]).slice(0,3);st.asked.push(...st.qs);st.res=null;render()}catch(e){b.disabled=false;b.textContent='Не вышло, ещё раз';}};ai.append(b)}
  else{st.qs.forEach((q,i)=>{const d=el('div','q');d.append(el('b','',(i+1)+'. '+q));const ta=el('textarea');ta.rows=2;ta.value=(st.ans&&st.ans[i])||'';ta.oninput=()=>{(st.ans=st.ans||[])[i]=ta.value};d.append(ta);
    if(st.res&&st.res.results&&st.res.results[i]){const rr=st.res.results[i];d.append(el('div','fb '+(rr.ok?'good':'bad'),(rr.ok?'✅ ':'❌ ')+rr.comment))}ai.append(d)});
   if(st.res){const pass=st.res.results.filter(x=>x.ok).length>=2;ai.append(el('div','ans',st.res.summary+'\n\n'+(pass?'🎉 Проверка пройдена!':'Нужно минимум 2 верных из 3. Перечитай капсулу и нажми «Новые вопросы».')))}
   const row=el('div');row.style.marginTop='8px';const chk=el('button','pri','Проверить ответы');
   chk.onclick=async()=>{const A=st.ans||[];if(!st.qs.every((_,i)=>(A[i]||'').trim())){toast('Ответь на все три вопроса');return}chk.disabled=true;chk.textContent='Проверяю…';
    try{const r=await aiJSON('Ты проверяешь ответы новичка по теме «'+c.t+'». Будь доброжелательным и справедливым: засчитывай ответ, если суть верна, даже простыми словами. Если неверно — коротко объясни, как правильно.\nТеория:\n'+c.theory+'\n\n'+st.qs.map((q,i)=>'Вопрос '+(i+1)+': '+q+'\nОтвет: '+A[i]).join('\n\n')+'\n\nВерни только JSON: {"results":[{"ok":true,"comment":"..."},{...},{...}],"summary":"1–2 предложения общего вывода"}');
     if(!r.results||r.results.length<3)throw 0;st.res=r;if(r.results.filter(x=>x.ok).length>=2&&!isDone(S.cap)){P.done.push(S.cap);save();toast('✅ Капсула пройдена!')}render()}catch(e){chk.disabled=false;chk.textContent='Проверить ответы';toast('Не удалось проверить, попробуй ещё раз')}};
   const nw=el('button','','Новые вопросы');nw.style.marginLeft='6px';nw.onclick=()=>{st.qs=null;st.ans=null;st.res=null;render()};row.append(chk,nw);ai.append(row)}}
 v.append(ai);
 const qb=el('div','box');qb.append(el('b','','⚡ Быстрая проверка (без ИИ)'));const sel=[];
 c.quiz.forEach((q,qi)=>{const d=el('div','q');d.append(el('b','',q.q));q.o.forEach((o,oi)=>{const l=el('label','opt',o);l.onclick=()=>{if(l.dataset.lock)return;sel[qi]=oi;d.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));l.classList.add('sel')};d.append(l)});
  const fb=el('div','fb');d.append(fb);d._fb=fb;qb.append(d)});
 const b=el('button','pri','Проверить');b.style.marginTop='8px';b.onclick=()=>{let ok=0;qb.querySelectorAll('.q').forEach((d,qi)=>{const q=c.quiz[qi],opts=d.querySelectorAll('.opt');opts.forEach((o,oi)=>{o.dataset.lock=1;o.classList.remove('sel');if(oi===q.a)o.classList.add('right');else if(oi===sel[qi])o.classList.add('wrong')});
  const good=sel[qi]===q.a;if(good)ok++;d._fb.className='fb '+(good?'good':'bad');d._fb.textContent=(good?'✅ ':'❌ ')+q.w});
  if(ok===c.quiz.length){if(!isDone(S.cap)){P.done.push(S.cap);save();toast('✅ Капсула пройдена!');progress()}b.after(el('div','ans','🎉 Пройдено! Следующая капсула открыта.'));b.remove()}else{b.textContent='Попробовать снова';b.onclick=()=>render()}};
 qb.append(b);v.append(qb);
 if(isDone(S.cap)){const nb=el('button','pri','К списку капсул →');nb.onclick=()=>{S.view='track';render()};v.append(nb)}}

render();
initAI();
</script>
